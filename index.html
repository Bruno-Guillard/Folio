<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Folio" />
  <title>Folio</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Retour">←</button>
      <div class="brand-wrap">
        <div class="brand">FOLIO</div>
        <div id="subtitle" class="subtitle">Collection · achats · ventes</div>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="Menu">⋯</button>
    </header>

    <main id="main" class="main"></main>

    <button id="fab" class="fab" aria-label="Ajouter">＋</button>

    <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
    <section id="sheet" class="sheet hidden" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div id="sheetContent"></div>
    </section>

    <input id="backupFile" type="file" accept=".folio,.json,application/json" hidden />
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
